<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>트롤킷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#0c0c10;--card:#17171f;--line:#2a2a36;--acc:#c6ff3d;--pink:#ff3d7f;--tx:#f2f2f5;--mut:#8b8b99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.2px}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 70px}
.logo{font-size:36px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--acc)}
.sub{color:var(--mut);margin:4px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.96)}
.card .e{width:44px;height:44px;border-radius:12px;background:rgba(198,255,61,.1);color:var(--acc);display:flex;align-items:center;justify-content:center}.card b{display:block;margin-top:8px;font-size:16px}.card small{color:var(--mut);font-size:12px}
.fld{margin:14px 0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input[type=text],textarea,select{width:100%;background:#101017;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:15px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
input[type=range]{flex:1;accent-color:var(--acc)}
input[type=file]{color:var(--mut);font-size:13px;width:100%}
.row{display:flex;gap:12px;align-items:center}.row b{min-width:42px;text-align:right;color:var(--acc)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;font-size:16px;font-weight:800;margin-top:10px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.b1{background:var(--acc);color:#111}.b2{background:#262633;color:var(--tx)}.b3{background:var(--pink);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px 16px;margin-top:16px}
.sec h3{margin:16px 0 2px;font-size:15px}
.back{background:none;border:0;color:var(--mut);font-size:15px;padding:0;margin-bottom:12px;font-family:inherit}
.hint{font-size:12px;color:var(--mut);line-height:1.55}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin:0}.chk input{width:22px;height:22px;accent-color:var(--acc)}
.h1{font-size:26px;font-weight:900;margin:0}
#linkbox{display:none;margin-top:12px}#linkbox textarea{min-height:90px;font-size:12px;word-break:break-all}
.warn{color:#ffb84d}
#stage{position:fixed;inset:0;z-index:50;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;z-index:95;pointer-events:none;white-space:nowrap;animation:tf 1.3s forwards}
@keyframes tf{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.bait{position:absolute;inset:0;background:#fff;color:#111;display:flex;flex-direction:column}
.bh{padding:20px 16px 6px;font-weight:800;font-size:21px}.bp{padding:0 16px 12px;color:#555;font-size:14px;line-height:1.5;white-space:pre-wrap}
.emo{position:relative;flex:1;overflow:hidden;background:#e9f7df}
.emo span{position:absolute;line-height:1}
.blurimg{flex:1;position:relative;overflow:hidden;transition:filter .3s;background:#222}

.dotbg{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center}
.dot{position:absolute;left:50%;top:55%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff}
.cnt{position:absolute;bottom:14%;font-size:40px;font-weight:900;opacity:.7}
.scare{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:flash .12s steps(1) infinite}
@keyframes flash{0%{background:#000}50%{background:#8a0000}}
.mwrap{animation:shake .05s linear infinite}
.mwrap svg{width:96vmin;max-height:80vh;animation:zoom .22s ease-out forwards}
@keyframes zoom{from{transform:scale(.15)}to{transform:scale(1.12)}}
@keyframes shake{0%{translate:0 0}25%{translate:-9px 6px}50%{translate:8px -7px}75%{translate:-6px -5px}}
.scare h1{font-size:14vmin;color:#fff;margin:0;text-shadow:0 0 24px red;animation:shake .05s infinite;text-align:center;padding:0 10px}
.news{position:absolute;inset:0;background:#f4f4f6;color:#111;display:flex;flex-direction:column}
.news .ph{margin:0 16px;flex:1;max-height:55vh;border-radius:14px;overflow:hidden;background:#000;position:relative}
.news .meta{padding:12px 16px;color:#888;font-size:13px}
canvas.full{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dmg{position:absolute;top:0;left:0;right:0;background:#d00;color:#fff;font-weight:800;text-align:center;padding:8px;animation:blink .4s steps(1) infinite;z-index:3}
@keyframes blink{50%{opacity:.2}}
.term{position:absolute;inset:0;background:#000;color:#3dff6e;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;display:flex;flex-direction:column}
.term .top{padding:10px 12px;border-bottom:1px solid #0f4020;color:#6f6}
.term .log{flex:1;padding:12px;overflow:hidden;white-space:pre-wrap;line-height:1.6;position:relative;z-index:2}
.term .bar{margin:12px;border:1px solid #3dff6e;height:22px;position:relative;z-index:2}
.term .bar i{display:block;height:100%;width:0;background:#3dff6e}
.term .pl{margin:0 12px 18px;position:relative;z-index:2}
.term .fx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9vmin;font-weight:900;text-align:center;background:#000d;z-index:5;animation:blink .5s steps(1) infinite;padding:20px}
.run{position:absolute;inset:0;background:linear-gradient(160deg,#ffe259,#ffa751);color:#222;text-align:center}
.run .bh{padding-top:60px;font-size:26px}.run .bp{color:#5a3b00;font-size:16px}
.rbtn{position:absolute;padding:16px 26px;border-radius:30px;border:0;background:#e8112d;color:#fff;font-size:19px;font-weight:900;box-shadow:0 6px 0 #9a0a1d;transition:left .12s,top .12s;white-space:nowrap;font-family:inherit}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9vmin;font-weight:900;padding:20px;z-index:4;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.fp{position:absolute;inset:0;background:#f7f7fa;color:#111;display:flex;flex-direction:column;align-items:center;text-align:center}

@keyframes spin{to{transform:rotate(360deg)}}
.fptx{margin-top:28px;font-size:24px;font-weight:900;color:#a0522d;min-height:34px}
.lie{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,#14284d,#050a14);color:#cfe3ff;display:flex;flex-direction:column;align-items:center;text-align:center}
.lie .bh{padding-top:40px;color:#fff;letter-spacing:1px}
.lie .q{margin:8px 20px 0;font-size:18px;color:#fff;background:#ffffff14;padding:10px 16px;border-radius:12px}
.lie canvas{width:90%;height:90px;margin-top:20px;border:1px solid #2a4a80;border-radius:10px;background:#0006}
.lpad{margin-top:22px;width:130px;height:130px;border-radius:50%;border:3px solid #3a7bff;display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 0 30px #3a7bff66}
.lst{margin-top:18px;font-size:16px;min-height:24px}
.lres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10vmin;font-weight:900;text-align:center;padding:20px;z-index:4}
.zone{position:absolute;top:0;width:90px;height:90px;z-index:6}
.rev{position:absolute;inset:0;z-index:99;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;animation:pop .4s ease-out}
.rev .t{font-size:12vmin;font-weight:900;color:var(--acc);margin-bottom:8px}
.rev .btn{max-width:320px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fbox{background:#101017;border:1px dashed #3a3a4a;border-radius:14px;padding:12px;text-align:center;position:relative;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--mut)}
.fbox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fbox .ic{color:var(--acc);line-height:0}.fbox img{width:72px;height:72px;object-fit:cover;border-radius:10px}

.mimg{width:92vmin;max-height:68vh;object-fit:cover;border-radius:22px;filter:contrast(1.35) saturate(1.4);animation:zoom .22s ease-out forwards;display:block}
.phimg{width:100%;height:100%;object-fit:cover;border-radius:14px}
.ph.has{filter:none;background:#000}
.rimg{display:block;margin:6px auto;max-width:80%;max-height:30vh;border-radius:16px;box-shadow:0 6px 20px #0003}
.fimg{max-width:70%;max-height:28vh;border-radius:16px;margin-top:14px}
.bimg{display:block;max-width:80%;max-height:40vh;border-radius:12px;margin:0 auto 16px}
.dk{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#2a2350,#0b0b18);color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:auto}

.uph{width:100%;display:flex;justify-content:center}
.ufill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ubox{position:absolute;left:18%;right:18%;top:16%;bottom:24%;border:3px dashed #c6ff3d;border-radius:46%;animation:blink 1s steps(1) infinite}
.uscan{position:absolute;left:0;right:0;height:4px;background:#c6ff3d;box-shadow:0 0 18px #c6ff3d;animation:scan 1.2s ease-in-out infinite alternate}
@keyframes scan{from{top:4%}to{top:94%}}
.stamp{position:absolute;right:8px;top:12px;border:4px solid #ff2d55;color:#ff2d55;font-weight:900;font-size:22px;padding:4px 10px;transform:rotate(12deg);background:#fff9}
.umet{width:84vw;max-width:380px;margin:12px 0 30px;font-size:13px}
.mrow{display:flex;align-items:center;gap:8px;margin:5px 0;animation:pop .25s}.mrow span:first-child{width:110px;text-align:left;color:#b9b9d0}
.mbar{flex:1;height:8px;background:#ffffff1a;border-radius:4px;overflow:hidden}.mbar i{display:block;height:100%;background:#ff3d7f}
.mrow b{width:40px;text-align:right}
.ures{animation:pop .4s ease-out}.upc{font-size:64px;font-weight:900;color:#ff3d7f;line-height:1}
.mir{position:absolute;inset:0;background:#000;overflow:hidden}
.mirbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#3a3a44,#0a0a0f)}
.mirv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ghost{position:absolute;top:10%;width:46vw;max-width:260px;opacity:0;filter:blur(2px);z-index:2}
.ghost.gr{right:4%}.ghost.gl{left:4%}
.ghost.gjump{top:5%;left:50%;right:auto;width:110vw;max-width:none;transform:translateX(-50%) scale(1.15);filter:none;animation:shake .05s linear infinite}
.mtop{position:absolute;top:0;left:0;right:0;padding:16px;text-align:center;color:#fff;font-weight:800;background:linear-gradient(#000a,#0000);z-index:3}
.mst{position:absolute;bottom:90px;left:16px;right:16px;text-align:center;color:#fff;font-size:15px;z-index:3;text-shadow:0 1px 4px #000;white-space:pre-wrap}
.mgo{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:auto;padding:15px 28px;z-index:4}
.flashing{animation:flash .12s steps(1) infinite}
.mbig{position:absolute;bottom:12%;left:0;right:0;text-align:center;font-size:13vmin;font-weight:900;color:#fff;text-shadow:0 0 24px red;z-index:5;animation:shake .05s infinite}
.qpz{margin-top:14px;font-size:26px;font-weight:900;background:#ffffff14;padding:12px 20px;border-radius:16px}
.qcd{font-size:110px;font-weight:900;margin-top:10px;line-height:1}
.qmeter{width:70vw;max-width:320px;height:14px;background:#ffffff1a;border-radius:7px;overflow:hidden;margin-top:14px}.qmeter i{display:block;height:100%;width:0;background:#c6ff3d;transition:width .06s}
.qst{margin-top:14px;font-size:17px;min-height:26px}
.parrot{margin-top:16px;line-height:0;transition:transform .1s}.parrot svg{width:210px;height:auto}.parrot img{width:180px;height:180px;object-fit:cover;border-radius:50%;border:6px solid #c6ff3d}
.parrot.talk{animation:talk .18s ease-in-out infinite alternate}

.kbw{position:absolute;inset:0;background:#ffefe0;color:#111;overflow:auto}
.kbimg{display:block;width:100%;max-height:30vh;object-fit:cover}
.kbc{background:#fff;margin:16px;border-radius:18px;box-shadow:0 6px 24px #0001;display:flex;flex-direction:column}
.kbbox{position:relative;margin:0 16px;border:2px solid #ff6b00;border-radius:12px;padding:14px;font-size:18px;min-height:54px;background:#fff}
.kbbox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
.caret{display:inline-block;width:2px;height:20px;background:#111;vertical-align:middle;margin-left:1px;animation:blink 1s steps(1) infinite}
.lock{position:absolute;inset:0;background:linear-gradient(170deg,#1e3c72,#0b1530);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;align-items:center}
.lclock{font-size:76px;font-weight:300;margin-top:44px;line-height:1}.ldate{opacity:.8;margin-top:6px}
.ltit{margin-top:26px;font-size:18px;font-weight:700}.lsub{margin-top:4px;font-size:14px;opacity:.8;min-height:20px}
.ldots{display:flex;gap:16px;margin:18px 0}.ldots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.ldots i.on{background:#fff}
.shk{animation:shake .08s linear 5}

.lover{position:absolute;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:17px;padding:24px;z-index:5;gap:6px}
.lbig{font-size:13vmin;font-weight:900;color:#fff}.lcnt{font-size:34px;font-variant-numeric:tabular-nums;margin-top:10px;color:#c6ff3d}
.gacha{position:absolute;inset:0;background:linear-gradient(160deg,#ff9a9e,#fecfef);color:#222;display:flex;flex-direction:column;align-items:center;text-align:center}

.gm{margin-top:16px;background:#e8112d;padding:16px;border-radius:24px;box-shadow:0 10px 30px #0003}

.glist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 20px;font-size:13px}.glist span{background:#fff8;padding:4px 10px;border-radius:12px}

.vbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}

.vinfo{padding:12px 14px}.vtitle{font-size:18px;font-weight:800;line-height:1.35}.vmeta{color:#666;font-size:13px;margin-top:6px}

.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:86%;max-width:380px;margin-top:24px}

.rcnt{margin-top:20px;color:#678;font-size:14px}

function b32enc(bytes){ let bits=0,val=0,out=''; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } } if(bits>0) out+=B32[(val<<(5-bits))&31]; return out; }
function b32dec(s){ let bits=0,val=0; const out=[]; for(const ch of s){ const i=B32.indexOf(ch); if(i<0) continue; val=(val<<5)|i; bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } } return new Uint8Array(out); }
function encodeCfg(cfg){

  if(usePhoto(cfg) && cfg.pm) o.pm=cfg.pm;
  if(+cfg.dg && cfg.dm) o.dm=cfg.dm;
  return 'p-'+b32enc(new TextEncoder().encode(JSON.stringify(o)));
}

    const br=noise(dur+.3), bp0=AC.createBiquadFilter(); bp0.type='bandpass'; bp0.frequency.value=3200; bp0.Q.value=.7; const brg=G(); brg.gain.value=.35; br.connect(bp0); bp0.connect(brg); brg.connect(src); br.start(t);
    const mix=G(); mix.gain.value=1;
    [[1050,4,1],[2300,7,.55],[3400,9,.35],[700,3,.4]].forEach(([fq,q,gv])=>{ const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fq; bp.Q.value=q; const g=G(); g.gain.value=gv*2.2; src.connect(bp); bp.connect(g); g.connect(mix); });
    const ds=dist(120), hs=AC.createBiquadFilter(); hs.type='highshelf'; hs.frequency.value=2500; hs.gain.value=6;
    const env2=G(); env2.gain.setValueAtTime(.0001,t); env2.gain.exponentialRampToValueAtTime(1,t+.04); env2.gain.setValueAtTime(1,t+dur-.5); env2.gain.exponentialRampToValueAtTime(.0001,t+dur+.25);
    mix.connect(ds); ds.connect(hs); hs.connect(env2); env2.connect(M);
    // 날카로운 쇳소리
    const sc=O('sine',3200); sc.frequency.linearRampToValueAtTime(4600,t+1.5); const scg=G(); env(scg,t,.05,1.2,.4,.08); sc.connect(scg); scg.connect(M); sc.start(t); sc.stop(t+2);
  }
  else if(name==='heart'){
    [0,.18].forEach((d,i)=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(70,t+d); o.frequency.exponentialRampToValueAtTime(38,t+d+.15); const g=G(); env(g,t+d,.005,.02,.18,i?.6:1); o.connect(g); g.connect(M); o.start(t+d); o.stop(t+d+.3); });
  }
  else if(name==='glass'){
    for(let i=0;i<14;i++){
      const tt=t+Math.random()*.35, n=noise(.3), hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2500+Math.random()*3000;
      const g=G(); env(g,tt,.002,.01,.15+Math.random()*.25,.8); n.connect(hp); hp.connect(g); g.connect(M); n.start(tt); n.stop(tt+.5);
      const o=AC.createOscillator(); o.type='sine'; o.frequency.value=3000+Math.random()*5000; const og=G(); env(og,tt,.002,0,.4,.15); o.connect(og); og.connect(M); o.start(tt); o.stop(tt+.5);
    }
    const n=noise(.4), lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; const g=G(); env(g,t,.002,.02,.3,1); n.connect(lp); lp.connect(g); g.connect(M); n.start(t);
  }
  else if(name==='fart'){
    const dur=1.1+Math.random()*.6, o=O('sawtooth',90), lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=6;
    const steps=40, curve=new Float32Array(steps); for(let i=0;i<steps;i++) curve[i]=65+Math.random()*55-i*0.6;
    o.frequency.setValueCurveAtTime(curve,t,dur);
    const g=G(); const gc=new Float32Array(steps); for(let i=0;i<steps;i++) gc[i]=(0.5+Math.random()*.5)*(i<2?i/2:1)*(1-i/steps*.6);
    gc[steps-1]=0; g.gain.setValueCurveAtTime(gc,t,dur);
    o.connect(lp); lp.connect(g); g.connect(M); o.start(t); o.stop(t+dur+.05);
    const n=noise(dur), nl=AC.createBiquadFilter(); nl.type='lowpass'; nl.frequency.value=350; const ng=G(); env(ng,t,.05,dur-.3,.25,.35); n.connect(nl); nl.connect(ng); ng.connect(M); n.start(t);
  }
  else if(name==='boom'){
    const n=noise(2.5), lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1200,t); lp.frequency.exponentialRampToValueAtTime(60,t+2);
    const g=G(); env(g,t,.005,.1,2,1); n.connect(lp); lp.connect(g); g.connect(M); n.start(t);
    const o=O('sine',130); o.frequency.exponentialRampToValueAtTime(30,t+1.2); const og=G(); env(og,t,.005,.1,1.3,1); o.connect(og); og.connect(M); o.start(t); o.stop(t+1.6);
  }
  else if(name==='siren'){
    const o=O('square',650), lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2500;
    for(let i=0;i<4;i++){ o.frequency.linearRampToValueAtTime(1250,t+i*.7+.35); o.frequency.linearRampToValueAtTime(650,t+i*.7+.7); }
    const g=G(); env(g,t,.02,2.6,.2,.45); o.connect(lp); lp.connect(g); g.connect(M); o.start(t); o.stop(t+3);
  }
  else if(name==='airhorn'){
    [0,.45,.9].forEach((s,k)=>{ const len=k==2?1.1:.35;
      [415,420,622,830].forEach(f=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const g=G(); env(g,t+s,.01,len,.08,.18); const d=dist(20); o.connect(d); d.connect(g); g.connect(M); o.start(t+s); o.stop(t+s+len+.2); });
    });
  }
  else if(name==='alarm'){
    for(let i=0;i<10;i++){ const o=AC.createOscillator(); o.type='square'; o.frequency.value=i%2?660:990; const g=G(); env(g,t+i*.16,.005,.11,.03,.35); o.connect(g); g.connect(M); o.start(t+i*.16); o.stop(t+i*.16+.2); }
  }
  else if(name==='static'){
    const n=noise(2), bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3000; bp.Q.value=.5; const g=G(); env(g,t,.01,1.6,.3,.5); n.connect(bp); bp.connect(g); g.connect(M); n.start(t);
  }
  else if(name==='ding'){
    [880,1320].forEach((f,i)=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f; const g=G(); env(g,t+i*.15,.005,.05,.6,.5); o.connect(g); g.connect(M); o.start(t+i*.15); o.stop(t+i*.15+.8); });
  }
  else if(name==='beep'){
    const o=AC.createOscillator(); o.type='square'; o.frequency.value=1100+Math.random()*600; const g=G(); env(g,t,.003,.02,.03,.12); o.connect(g); g.connect(M); o.start(t); o.stop(t+.08);
  }
}
const VOICES = {monster:[0.1,0.6],normal:[1,1],chip:[2,1.6],robot:[0.5,0.85]};
function speak(cfg){
  if(!cfg.sp || !window.speechSynthesis) return;
  try{
    const u=new SpeechSynthesisUtterance(cfg.sp); u.lang='ko-KR';
    const ko=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang)); if(ko) u.voice=ko;
    const [p,r]=VOICES[cfg.vo]||VOICES.normal; u.pitch=p; u.rate=r; u.volume=Math.min(1,cfg.v/10);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function vib(cfg,pat){ if(+cfg.vb && navigator.vibrate){ try{ navigator.vibrate(pat); }catch(e){} } }
function fire(cfg){
  const n=Math.max(1,+cfg.srp||1);
  if(cfg.s!=='none') for(let i=0;i<n;i++) setTimeout(()=>{ if(STAGE) playSound(cfg.s, cfg.v); }, i*1100);
  setTimeout(()=>{ if(STAGE) speak(cfg); }, (+cfg.spd||0)*1000);
  const k={weak:.4,mid:1,strong:1.8}[cfg.vst]||1;
  vib(cfg,[300,80,500,80,300].map(x=>Math.round(x*k)));
}

/* ---------- 저장소 media 폴더 ---------- */
let MEDIA={img:[],aud:[],ok:false,err:''};
const IMG_RE=/\.(jpe?g|png|gif|webp)$/i, AUD_RE=/\.(mp3|m4a|wav|ogg|aac|webm)$/i;
async function loadMedia(){
  try{
    const host=location.hostname, m=host.match(/^([^.]+)\.github\.io$/i);
    if(!m){ MEDIA.err='깃허브 페이지에서 열면 media 폴더 파일이 여기 떠.'; return; }
    const seg=location.pathname.split('/').filter(Boolean); const repo=seg.length?seg[0]:host;
    const r=await fetch(`https://api.github.com/repos/${m[1]}/${repo}/contents/media`);
    if(!r.ok){ MEDIA.err='media 폴더를 못 찾았어.'; return; }
    const list=await r.json(); const names=list.filter(f=>f.type==='file').map(f=>f.name);
    MEDIA.img=names.filter(n=>IMG_RE.test(n)); MEDIA.aud=names.filter(n=>AUD_RE.test(n)); MEDIA.ok=true;
  }catch(e){ MEDIA.err='media 폴더를 못 읽었어.'; }
  if(CFG && document.querySelector('.wiz')){ syncCustom(); syncDisg(); }
}

function scareImageSrc(cfg){

let SCARE_IMG=null, SCARE_KEY='';
function preloadScare(cfg){ const src=scareImageSrc(cfg); if(SCARE_KEY===src&&SCARE_IMG) return SCARE_IMG; SCARE_KEY=src; SCARE_IMG=new Image(); SCARE_IMG.src=src; return SCARE_IMG; }

function scareNow(cfg){
  STAGE.dataset.done=1; clearTimers();
  const sz=(+cfg.msz||100)/100, fz=(+cfg.fxs||100)/100, shk={none:0,weak:.4,strong:1}[cfg.shk||'strong'];
  STAGE.innerHTML=`<div class="scare2"><canvas id="scv"></canvas>${cfg.mt?`<h1 style="font-size:${14*fz}vmin">${esc(cfg.mt)}</h1>`:''}</div>`;
  const cv=document.getElementById('scv'), dpr=Math.min(2,window.devicePixelRatio||1), W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, x=cv.getContext('2d');
  const img=preloadScare(cfg);
  const nz=document.createElement('canvas'); nz.width=nz.height=256; const nx=nz.getContext('2d'), nd=nx.createImageData(256,256);
  for(let i=0;i<nd.data.length;i+=4){ const v=Math.random()*255; nd.data[i]=nd.data[i+1]=nd.data[i+2]=v; nd.data[i+3]=255; } nx.putImageData(nd,0,0);
  const vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.85)');
  const t0=performance.now(); let fr=0;
  const draw=()=>{
    if(!cv.isConnected) return; fr++;
    const t=(performance.now()-t0)/1000;
    x.globalCompositeOperation='source-over'; x.fillStyle='#000'; x.fillRect(0,0,W,H);
    if(img.complete&&img.naturalWidth){
      const kick = t<.12 ? .55+t*4 : 1.03+Math.sin(t*9)*.02;
      const s=Math.max(W/img.naturalWidth,H/img.naturalHeight)*1.04*sz*kick;
      const jx=(Math.random()-.5)*28*dpr*shk, jy=(Math.random()-.5)*28*dpr*shk;
      const dw=img.naturalWidth*s, dh=img.naturalHeight*s, dx=(W-dw)/2+jx, dy=(H-dh)/2+jy-H*.03;
      x.drawImage(img,dx,dy,dw,dh);
      if(shk>0){ x.globalCompositeOperation='lighter'; x.globalAlpha=.22; x.drawImage(img,dx+10*dpr*shk,dy,dw,dh); x.globalAlpha=1; x.globalCompositeOperation='source-over'; }
    }
    x.globalCompositeOperation='saturation'; x.fillStyle='#808080'; x.fillRect(0,0,W,H);
    x.globalCompositeOperation='source-over';
    if(Math.random()<.35){ const n=3+Math.random()*5|0; for(let i=0;i<n;i++){ const y=Math.random()*H, h=(4+Math.random()*40)*dpr; x.drawImage(cv,0,y,W,h,(Math.random()-.5)*60*dpr,y,W,h); } }
    x.globalAlpha=.22; x.drawImage(nz,-Math.random()*256,-Math.random()*256,W+512,H+512); x.globalAlpha=1;
    x.fillStyle=vg; x.fillRect(0,0,W,H);
    if(+cfg.fla!==0){ if(fr%7===0){ x.globalCompositeOperation='difference'; x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.globalCompositeOperation='source-over'; }
      else if(fr%11===0){ x.fillStyle='rgba(140,0,0,.45)'; x.fillRect(0,0,W,H); } }
    requestAnimationFrame(draw);
  };
  draw();
  addExit(); fire(cfg); reveal(cfg,3400);
}

function drawCrack(cv,x,y){
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr);
  const spokes=[], N=18;
  for(let i=0;i<N;i++){
    let a=i/N*Math.PI*2+rnd(-.15,.15), px=x, py=y, pts=[[x,y]], dist=0;
    while(px>-50&&px<W+50&&py>-50&&py<H+50){ a+=rnd(-.3,.3); const s=rnd(12,38); px+=Math.cos(a)*s; py+=Math.sin(a)*s; dist+=s; pts.push([px,py,dist]); }
    spokes.push(pts);
  }
  const line=(pts,w,col)=>{ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); pts.forEach(p=>c.lineTo(p[0],p[1])); c.lineWidth=w; c.strokeStyle=col; c.stroke(); };
  c.lineJoin='round';
  spokes.forEach(p=>{ line(p,3,'rgba(0,0,0,.45)'); line(p,1.3,'rgba(255,255,255,.95)'); });
  spokes.forEach(p=>{ for(let k=3;k<p.length;k+=3){ if(Math.random()<.35){ let a=rnd(0,6.28),px=p[k][0],py=p[k][1],b=[[px,py]]; for(let j=0;j<4;j++){ a+=rnd(-.5,.5); px+=Math.cos(a)*rnd(8,20); py+=Math.sin(a)*rnd(8,20); b.push([px,py]); } line(b,1,'rgba(255,255,255,.8)'); } } });
  [25,60,110,180].forEach(R=>{
    const ring=spokes.map(p=>p.find(q=>q[2]>=R)||p[p.length-1]);
    for(let i=0;i<ring.length;i++){ if(Math.random()<.7){ const a=ring[i], b=ring[(i+1)%ring.length]; line([a,[ (a[0]+b[0])/2+rnd(-6,6),(a[1]+b[1])/2+rnd(-6,6)],b],1.1,'rgba(255,255,255,.85)'); } }
  });
  const g=c.createRadialGradient(x,y,0,x,y,40); g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=g; c.beginPath(); c.arc(x,y,40,0,7); c.fill();
  ['#ff00ff','#00ff66','#00e5ff'].forEach(col=>{ c.fillStyle=col; c.globalAlpha=.75; c.fillRect(rnd(0,W),0,rnd(1,4),H); });
  c.globalAlpha=1;
  const bx=x+rnd(-30,30), by=y+rnd(-30,30); let r=8, k=0;
  const iv=setInterval(()=>{ if(!cv.isConnected||k++>40){ clearInterval(iv); return; } r+=rnd(2,6);
    for(let i=0;i<6;i++){ const a=rnd(0,6.28), d=rnd(0,r); const g=c.createRadialGradient(bx+Math.cos(a)*d,by+Math.sin(a)*d,0,bx+Math.cos(a)*d,by+Math.sin(a)*d,rnd(10,28)); g.addColorStop(0,'rgba(0,0,0,.95)'); g.addColorStop(.6,'rgba(10,0,30,.7)'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.beginPath(); c.arc(bx+Math.cos(a)*d,by+Math.sin(a)*d,28,0,7); c.fill(); }
    if(k%8===0){ c.fillStyle=['#ff00aa','#00ff88','#00ccff','#ffffff'][k/8%4|0]; c.globalAlpha=.6; c.fillRect(bx+rnd(-60,60),0,rnd(1,3),H); c.globalAlpha=1; }
  },70);
}

/* ---------- 카메라·마이크 ---------- */
let STREAMS=[], MICPROC=null;
async function getMedia(c){ try{ if(!navigator.mediaDevices) return null; const s=await navigator.mediaDevices.getUserMedia(c); STREAMS.push(s); return s; }catch(e){ return null; } }
function stopMedia(){ STREAMS.forEach(s=>s.getTracks().forEach(t=>t.stop())); STREAMS=[]; if(MICPROC){ try{ MICPROC.disconnect(); MICPROC.onaudioprocess=null; }catch(e){} MICPROC=null; } }
function videoEl(stream,mirror=true){ const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.muted=true; v.setAttribute('playsinline',''); v.srcObject=stream; if(mirror) v.style.transform='scaleX(-1)'; v.play().catch(()=>{}); return v; }
function rms(an,buf){ an.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i]; return Math.sqrt(s/buf.length); }

const VOC={chip:1.75,monster:.6,robot:1,baby:1.35,slow:.72};
function runCopy(cfg){
  STAGE.innerHTML=`<div class="dk" style="background:linear-gradient(160deg,#1b5e20,#0d2b10)"><div class="bh">${esc(cfg.bt)}</div><div class="bp">${esc(cfg.bb)}</div>
    <div class="parrot" id="pr">${usePhoto(cfg)&&PHOTO.data?`<img alt="" src="${esc(PHOTO.data)}">`:PARROT_SVG}</div>
    <div class="qst" id="cs">마이크를 허용하면 시작돼요</div><div class="qmeter" style="max-width:240px"><i id="cm"></i></div>
    <button class="btn b1" id="g2" style="max-width:300px">말 걸기 시작</button></div>`;
  const pr=document.getElementById('pr'), cs=document.getElementById('cs'), cm=document.getElementById('cm'), g2=document.getElementById('g2');
  let count=0;
  g2.addEventListener('pointerdown',async e=>{
    e.stopPropagation(); unlock(); g2.remove();
    const s=await getMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    if(!s||!AC){ cs.textContent='마이크를 못 켰어요'; return; }
    cs.textContent='듣는 중... 아무 말이나 해보세요';
    const src=AC.createMediaStreamSource(s), proc=AC.createScriptProcessor(4096,1,1); MICPROC=proc;
    const mute=AC.createGain(); mute.gain.value=0; src.connect(proc); proc.connect(mute); mute.connect(AC.destination);
    let chunks=[], speaking=false, silence=0, busyUntil=0; const thr=0.025, sr=AC.sampleRate;
    proc.onaudioprocess=ev=>{
      if(AC.currentTime<busyUntil) return;
      const d=ev.inputBuffer.getChannelData(0); let s2=0; for(let i=0;i<d.length;i++) s2+=d[i]*d[i]; const lv=Math.sqrt(s2/d.length);
      cm.style.width=Math.min(100,lv/thr*40)+'%';
      if(lv>thr){ speaking=true; silence=0; }
      if(speaking){ chunks.push(new Float32Array(d)); if(lv<=thr) silence+=d.length/sr; }
      const total=chunks.length*4096/sr;
      if(speaking && (silence>.7 || total>8)){
        speaking=false; silence=0; const ch=chunks; chunks=[];
        if(total<.35) return;
        const len=ch.reduce((a,c)=>a+c.length,0), b=AC.createBuffer(1,len,sr), bd=b.getChannelData(0); let o=0; ch.forEach(c=>{ bd.set(c,o); o+=c.length; });
        const rate=VOC[cfg.voc]||1.5, sN=AC.createBufferSource(); sN.buffer=b; sN.playbackRate.value=rate;
        const g=AC.createGain(); g.gain.value=Math.min(1.6,cfg.v/6);
        if(cfg.voc==='robot'){ const rm=AC.createGain(); rm.gain.value=0; const osc=AC.createOscillator(); osc.frequency.value=55; osc.connect(rm.gain); osc.start(); osc.stop(AC.currentTime+len/sr+.5); sN.connect(rm); rm.connect(g); }
        else sN.connect(g);
        g.connect(AC.destination); sN.start();
        const dur=len/sr/rate; busyUntil=AC.currentTime+dur+.35;
        pr.classList.add('talk'); cs.textContent='따라 하는 중...';
        setTimeout(()=>{ if(!STAGE) return; pr.classList.remove('talk'); cs.textContent='듣는 중... 또 말해보세요'; count++; if(+cfg.n>0&&count>=+cfg.n){ stopMedia(); +cfg.r ? reveal(cfg,200) : null; } },dur*1000+100);
      }
    };
  });
}

/* ---------- 11. 고장난 키보드 ---------- */
function runKb(cfg){
  STAGE.innerHTML=`<div class="kbw">${usePhoto(cfg)&&PHOTO.data?`<img class="kbimg" alt="" src="${esc(PHOTO.data)}">`:`<div class="kbban"><small>${esc(cfg.bs||'EVENT')}</small><b>${esc(cfg.bh||'치킨 1,000마리 쏜다')}</b><span>${esc(cfg.bd||'응모 기간 · 오늘 자정까지')}</span></div>`}
    <div class="kbc"><div class="bh">${esc(cfg.bt)}</div><div class="bp">${esc(cfg.bb)}</div>
    <label style="color:#555;margin:4px 16px 6px">${esc(cfg.q)}</label>
    <div class="kbbox"><span id="kt"></span><i class="caret"></i><input id="ki" type="text" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <button class="btn" id="ks" style="background:#ff6b00;color:#fff;margin:14px 16px 18px;width:auto">응모하기</button></div></div>`;
  const ki=document.getElementById('ki'), kt=document.getElementById('kt'), ks=document.getElementById('ks');
  const rp=String(cfg.rp||'나는 바보입니다'); let shown='';
  STAGE.style.touchAction='auto';
  ki.addEventListener('pointerdown',e=>e.stopPropagation());
  ki.addEventListener('input',()=>{ const n=[...ki.value].length; let s=''; while(s.length<n) s+=rp; shown=s.slice(0,n); kt.textContent=shown; });
  ks.addEventListener('click',()=>{
    unlock(); if(!shown){ toast('먼저 입력해주세요!'); ki.focus(); return; }
    ki.blur();
    const d=document.createElement('div'); d.className='big'; d.style.background='#fff7ec'; d.style.color='#222'; d.style.flexDirection='column'; d.style.fontSize='6vmin';
    d.innerHTML=`<div>${esc(cfg.dn)}</div><div style="margin-top:18px;font-size:5vmin;font-weight:400">응모자 이름: <b style="color:#e8112d">${esc(shown)}</b></div>`;
    STAGE.appendChild(d); fire(cfg); reveal(cfg,3800);
  });
}

/* ---------- 12. 영원한 잠금 ---------- */
function runLock(cfg){
  const steps=String(cfg.st).split('\n').map(s=>s.trim()).filter(Boolean); if(!steps.length) steps.push('30초','100년');
  const now=new Date(), hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  STAGE.innerHTML=`<div class="lock" ${usePhoto(cfg)&&PHOTO.data?`style="background-image:linear-gradient(#0008,#000c),url('${esc(PHOTO.data)}')"`:''}>
    <div class="lclock">${hh}:${mm}</div><div class="ldate">${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일</div>
    <div class="ltit">${esc(cfg.lt)}</div><div class="lsub" id="lsb">${esc(cfg.bt)}</div>
    <div class="ldots" id="ld">${'<i></i>'.repeat(4)}</div>
    <div class="lpad2" id="lkp">${[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k=>`<button data-k="${k}"${k===''?' style="visibility:hidden"':''}>${k==='del'?'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M16 9l-5 6M11 9l5 6"/></svg>':k}</button>`).join('')}</div>
    <div class="lover" id="lo"></div></div>`;
  const ld=document.getElementById('ld'), lo=document.getElementById('lo'), lsb=document.getElementById('lsb');
  let pin='', att=0, locked=false;
  const dots=()=>ld.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i<pin.length));
  document.getElementById('lkp').addEventListener('pointerdown',e=>{
    const b=e.target.closest('button'); if(!b||locked) return; e.stopPropagation(); unlock();
    const k=b.dataset.k; if(k==='del'){ pin=pin.slice(0,-1); dots(); return; } if(k==='') return;
    pin+=k; dots(); playSound('beep',cfg.v*.3);
    if(pin.length===4){ setTimeout(wrong,200); }
  });
  function wrong(){
    att++; pin=''; dots(); ld.classList.add('shk'); vib(cfg,[80,50,80]); setTimeout(()=>ld.classList.remove('shk'),400);
    lsb.textContent='PIN이 틀렸습니다';
    if(att===1){
      locked=true; lo.style.display='flex'; let c=30;
      lo.innerHTML=`<div>잘못된 시도</div><div class="lbig">${esc(steps[0])}</div><div>후에 다시 시도하세요</div><div class="lcnt" id="lc">00:30</div>`;
      const lc=document.getElementById('lc');
      const iv=I(()=>{ c--; lc.textContent='00:'+String(Math.max(0,c)).padStart(2,'0'); if(c<=0){ clearInterval(iv); lo.style.display='none'; locked=false; lsb.textContent=cfg.bt; } },160);
      return;
    }
    locked=true; lo.style.display='flex'; let i=1;
    const show=()=>{
      const last=i>=steps.length-1;
      lo.innerHTML=`<div>${i>1?'보안 위반 감지 · 잠금 시간 증가':'잘못된 시도 횟수 초과'}</div><div class="lbig">${esc(steps[Math.min(i,steps.length-1)])}</div><div>후에 다시 시도하세요</div>${last?`<div style="margin-top:24px;color:#ff5a6e;font-weight:800">${esc(cfg.ft)}</div>`:''}`;
      lo.firstElementChild.style.color=i>1?'#ff5a6e':'';
      vib(cfg,120); playSound('beep',cfg.v);
      if(last){ fire(cfg); reveal(cfg,4000); return; }
      i++; T(show,2300);
    };
    show();
  }
}

/* ---------- 13. 절대 안 되는 뽑기 ---------- */
function runGacha(cfg){
  const prizes=String(cfg.pr).split('\n').map(s=>s.trim()).filter(Boolean); if(!prizes.length) prizes.push('치킨');
  const lose=cfg.ls||'꽝'; let left=+cfg.n, spinning=false;
  STAGE.innerHTML=`<div class="gacha"><div class="bh">${esc(cfg.bt)}</div><div class="bp">${esc(cfg.bb)}</div>
    <div class="gm"><div class="gwin" id="gw">?</div></div>
    <div class="glist">${prizes.map(p=>`<span>${esc(p)}</span>`).join('')}</div>
    <button class="btn" id="gs" style="background:#e8112d;color:#fff;max-width:300px;box-shadow:0 6px 0 #9a0a1d">뽑기 (남은 기회 ${left})</button></div>`;
  const gw=document.getElementById('gw'), gs=document.getElementById('gs');
  const taunts=['아깝다!!','한 칸 차이였는데...','다음엔 될 거야 (아님)','운이 없네요 ㅋ','거의 다 왔어요!'];
  gs.addEventListener('pointerdown',e=>{
    e.stopPropagation(); unlock(); if(spinning||left<=0) return; spinning=true; left--;
    const pool=prizes.concat([lose]); let t=0, delay=50;
    const tick=()=>{
      gw.textContent=pool[Math.floor(Math.random()*pool.length)]; playSound('beep',cfg.v*.4); t+=delay; delay*=1.09;
      if(t<2300){ T(tick,delay); return; }
      gw.textContent=prizes[Math.floor(Math.random()*prizes.length)]; gw.classList.add('near');
      T(()=>{ gw.classList.remove('near'); gw.textContent=lose; spinning=false;
        if(left>0){ toast(taunts[Math.floor(Math.random()*taunts.length)]); gs.textContent=`뽑기 (남은 기회 ${left})`; vib(cfg,60); }
        else{
          const d=document.createElement('div'); d.className='big'; d.style.background='#fff1f1'; d.style.color='#222'; d.style.flexDirection='column';
          d.innerHTML=(usePhoto(cfg)&&PHOTO.data?`<img class="bimg" alt="" src="${esc(PHOTO.data)}">`:'')+esc(cfg.ft);
          STAGE.appendChild(d); fire(cfg); reveal(cfg,3500);
        }
      },650);
    };
    tick();
  });
}

/* ---------- 14. 버퍼링 공포 ---------- */
function runBuf(cfg){
  const thumb = usePhoto(cfg)&&PHOTO.data ? `<img class="ufill" alt="" src="${esc(PHOTO.data)}">` : sceneTag('house',(Math.random()*1e6)|0,'ufill');
  STAGE.innerHTML=`<div class="vp"><div class="vbox" id="vb">${thumb}<div class="vplay" id="vpl">▶</div><div class="vbar"><i id="vpr"></i></div><div class="vtime" id="vtm">0:00 / ${esc(cfg.vl)}</div></div>
    <div class="vinfo"><div class="vtitle">${esc(cfg.vt)}</div><div class="vmeta">${esc(cfg.vw)}</div>
    <div class="vch"><span class="vav">${esc((cfg.ch||'?').slice(0,1))}</span><b>${esc(cfg.ch)}</b><span class="vsub">구독</span></div>
    <div class="vcm">댓글 ${(Math.random()*900+100)|0}개<br><span>${esc(cfg.cm)}</span></div>
    ${[['house','폐가에서 들린 소리의 정체','공포탐정 · 조회수 91만회'],['night','새벽 3시에 절대 하면 안 되는 것','미스터리랩 · 조회수 412만회'],['house','CCTV에 찍힌 이상한 장면 TOP5','이슈탐험대 · 조회수 77만회']].map(r=>`<div class="vrel"><div class="vrt">${sceneTag(r[0],(Math.random()*1e6)|0,'ufill')}</div><div><b>${r[1]}</b><br><small>${r[2]}</small></div></div>`).join('')}</div></div>`;
  const vb=document.getElementById('vb'), vpl=document.getElementById('vpl'), vpr=document.getElementById('vpr'), vtm=document.getElementById('vtm');
  let on=false;
  vb.addEventListener('pointerdown',e=>{
    e.stopPropagation(); unlock(); if(on) return; on=true; vpl.remove();
    const ps=+cfg.ps*1000, bu=+cfg.bu*1000, gl=+cfg.gl*1000, t0=Date.now();
    vb.classList.add('playing');
    const iv=I(()=>{ const s=(Date.now()-t0)/1000; vpr.style.width=Math.min(4,s*.8)+'%'; vtm.textContent=`0:${String(Math.floor(s)).padStart(2,'0')} / ${cfg.vl}`; },200);
    T(()=>{ clearInterval(iv); vb.classList.remove('playing'); vb.insertAdjacentHTML('beforeend','<div class="vspin"></div>'); },ps);
    if(+cfg.hq) T(()=>toast('화질 자동 조정 중...'),ps+bu*.5);
    T(()=>{
      const sp=vb.querySelector('.vspin'); if(sp) sp.remove();
      if(gl>0){ const c=document.createElement('canvas'); c.className='full'; c.style.zIndex=3; vb.appendChild(c); c.width=160; c.height=90; const x=c.getContext('2d');
        I(()=>{ const im=x.createImageData(160,90); for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } x.putImageData(im,0,0); },50);
        playSound('static',cfg.v*.6); vib(cfg,[40,40,40,40,40]); }
      T(()=>scareNow(cfg),gl);
    },ps+bu);
  });
}

/* ---------- 15. 거꾸로 화면 ---------- */
function runRev(cfg){
  const decoys=String(cfg.dc).split('\n').map(s=>s.trim()).filter(Boolean); if(!decoys.length) decoys.push('취소');
  const nb=Math.max(1,+cfg.nb);
  let labels=[cfg.bn]; for(let i=1;i<nb;i++) labels.push(decoys[(i-1)%decoys.length]);
  labels.sort(()=>Math.random()-.5);
  STAGE.innerHTML=`<div class="revw"><div class="bh">${esc(cfg.bt)}</div><div class="bp">${esc(cfg.bb)}</div>${usePhoto(cfg)?photoTag('rimg'):''}
    <div class="rgrid" id="rg">${labels.map(l=>`<button class="rb ${l===cfg.bn?'win':''}">${esc(l)}</button>`).join('')}</div>
    <div class="rcnt" id="rc"></div></div><div class="finger" id="fg"></div>`;
  const fg=document.getElementById('fg'), rc=document.getElementById('rc'), rg=document.getElementById('rg');
  const taunts=String(cfg.tm).split('\n').map(s=>s.trim()).filter(Boolean);
  let tries=0, done=false;
  const modeAt=t=>{ if(cfg.md!=='step') return cfg.md; return t<+cfg.s1?'lr':t<+cfg.s1*2?'ud':'rnd'; };
  STAGE.addEventListener('pointerdown',e=>{
    if(done||e.target.closest('.exitz')) return; e.preventDefault();
    const W=innerWidth,H=innerHeight; let x=e.clientX,y=e.clientY; const m=modeAt(tries);
    if(m==='lr') x=W-x; else if(m==='ud') y=H-y; else if(m==='all'){ x=W-x; y=H-y; } else if(m==='rnd'){ x=rnd(20,W-20); y=rnd(20,H-20); }
    tries++;
    if(+cfg.fg){ fg.style.left=x+'px'; fg.style.top=y+'px'; fg.classList.remove('tap'); void fg.offsetWidth; fg.classList.add('tap'); }
    fg.style.display='none'; const el=document.elementFromPoint(x,y); fg.style.display='';
    const b=el&&el.closest&&el.closest('.rb');
    if(b){
      b.classList.add('prs'); setTimeout(()=>b.classList.remove('prs'),200);
      if(b.classList.contains('win')){ const others=[...rg.children].filter(c=>c!==b); if(others.length){ const o=others[Math.floor(Math.random()*others.length)]; const t=b.textContent; b.textContent=o.textContent; o.textContent=t; b.classList.remove('win'); o.classList.add('win'); } toast('앗! 위치가 바뀌었어요'); }
      else toast(`${b.textContent} 되었습니다`);
    } else if(taunts.length && Math.random()<.5) toast(taunts[Math.floor(Math.random()*taunts.length)]);
    playSound('beep',cfg.v*.4);
    if(+cfg.sc) rc.textContent=`시도 ${tries}회`;
    if(+cfg.n>0 && tries>=+cfg.n){ done=true; const d=document.createElement('div'); d.className='big'; d.style.background='#eef6ff'; d.style.color='#222'; d.textContent=cfg.ft; STAGE.appendChild(d); fire(cfg); reveal(cfg,2800); }
  });
}

/* ---------- 시작 ---------- */
function boot(){
  const h=location.hash.slice(1);
  if(h.indexOf('p-')===0){ try{ run(decodeCfg(h),true); return; }catch(e){} }
  menu();
}
window.addEventListener('hashchange',boot);
if(window.speechSynthesis){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
loadMedia();
boot();
</script>
